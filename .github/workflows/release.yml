name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build tarball
        run: |
          mkdir -p dist/sonarr-mkv-merger
          cp sonarr_mkv_merger.py qbt_complete.sh config.conf.example README.md LICENSE dist/sonarr-mkv-merger/
          tar -czf sonarr-mkv-merger.tar.gz -C dist sonarr-mkv-merger
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" sonarr-mkv-merger.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
